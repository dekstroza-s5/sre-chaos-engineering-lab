apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-api-dashboard
  namespace: monitoring
  labels: {grafana_dashboard: "1"}
data:
  demo-api.json: |
    {
      "title": "Demo API Reliability",
      "schemaVersion": 39,
      "panels": [
        {"type":"stat","title":"Success ratio","targets":[{"expr":"demo:request_success:ratio5m"}],"gridPos":{"h":8,"w":8,"x":0,"y":0}},
        {"type":"timeseries","title":"Request rate","targets":[{"expr":"sum(rate(demo_http_requests_total[5m]))"}],"gridPos":{"h":8,"w":8,"x":8,"y":0}},
        {"type":"timeseries","title":"Available replicas","targets":[{"expr":"kube_deployment_status_replicas_available{namespace=\"sre-lab\"}"}],"gridPos":{"h":8,"w":8,"x":16,"y":0}}
      ]
    }
