apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata: {name: demo-api-delay, namespace: sre-lab}
spec:
  action: delay
  mode: all
  selector: {namespaces: [sre-lab], labelSelectors: {app: demo-api}}
  delay: {latency: 500ms, correlation: "25", jitter: 100ms}
  direction: both
  duration: 2m
